name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # No TensorFlow here: the fast tests cover the pure-Python logic and skip the model tests.
      - run: python -m pip install -r requirements-ci.txt
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q
